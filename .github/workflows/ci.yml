name: CI

on:
  push:
    branches: [main, EngineImprovement]
  pull_request:
  workflow_dispatch:

jobs:
  naming:
    name: No coursework identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/ is excluded on purpose: the improvement plan documents the cleanup and
      # necessarily names the identifiers it removed.
      - name: Check for coursework identifiers
        run: |
          if git grep -nIiE "0130645|xbgt3124|ToGoGameEngine" -- . ':!docs/' ; then
            echo "::error::Coursework identifiers found. Everything is named ScrapEngine."
            exit 1
          fi
          echo "Clean - no coursework identifiers outside docs/."

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, preset: windows }
          - { name: Linux,   os: ubuntu-latest,  preset: linux }
          - { name: macOS,   os: macos-latest,   preset: macos }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Export vcpkg root
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
