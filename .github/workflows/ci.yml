name: CI

on:
  push:
    branches: [main, EngineImprovement]
  pull_request:
  workflow_dispatch:

jobs:
  naming:
    name: No coursework identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Three paths are excluded, all for the same reason - they describe the cleanup
      # rather than containing it. docs/ holds the improvement plan, graphify-out/
      # holds the knowledge graph whose rationale text quotes the old identifiers, and
      # this file defines the pattern it would otherwise match itself on.
      - name: Check for coursework identifiers
        run: |
          if git grep -nIiE "0130645|xbgt3124|ToGoGameEngine" \
               -- . ':!docs/' ':!graphify-out/' ':!.github/workflows/ci.yml' ; then
            echo "::error::Coursework identifiers found. Everything is named ScrapEngine."
            exit 1
          fi
          echo "Clean - no coursework identifiers in the source tree."

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, preset: windows }
          - { name: Linux,   os: ubuntu-latest,  preset: linux }
          - { name: macOS,   os: macos-latest,   preset: macos }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # autoconf/automake/libtool are required by the X11 and xcb ports that
          # GLFW pulls in - vcpkg builds those from source and they use autotools.
          sudo apt-get install -y \
            ninja-build pkg-config \
            autoconf autoconf-archive automake libtool \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The runners ship a preinstalled vcpkg whose ports/ tree sits at whatever
      # revision the image was built from. Fetching only our baseline commit is not
      # enough: vcpkg then reads port recipes from the checked-out tree but versions
      # from the baseline, and rejects the mismatch ("no version database entry for
      # glfw3 at ..."). Checking out the baseline itself keeps ports and versions
      # consistent, and pins CI to exactly the toolchain the manifest names.
      - name: Check out the pinned vcpkg
        shell: bash
        run: |
          BASELINE=$(jq -r '."builtin-baseline"' vcpkg.json)
          echo "Pinning vcpkg to $BASELINE"
          git init -q "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch -q --depth 1 origin "$BASELINE"
          git -C "$RUNNER_TEMP/vcpkg" checkout -q FETCH_HEAD
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
